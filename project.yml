# XcodeGen project definition.
#
# This file is the source of truth for the Xcode project (ticket §4.1). project.pbxproj is
# generated output and must never be hand-edited; run `make generate` after changing this.

name: MacNetLab

options:
  bundleIdPrefix: com.bee
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: false
  minimumXcodeGenVersion: "2.38.0"

# All build settings come from xcconfig files so that identifiers live in exactly one place.
configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig

packages:
  MacNetCore:
    path: Packages/MacNetCore

targets:

  # ---------------------------------------------------------------------------------------
  # The SwiftUI application. Runs as the logged-in user and is never root.
  # ---------------------------------------------------------------------------------------
  MacNetLab:
    type: application
    platform: macOS
    sources:
      - path: Apps/MacNetLab
        excludes:
          - "Info.plist"
          - "MacNetLab.entitlements"
    settings:
      base:
        PRODUCT_NAME: $(PRODUCT_NAME_BASE)
        # Ticket §26.1: English and Simplified Chinese in v0.1.
        SWIFT_EMIT_LOC_STRINGS: YES
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        INFOPLIST_FILE: Apps/MacNetLab/Info.plist
        CODE_SIGN_ENTITLEMENTS: Apps/MacNetLab/MacNetLab.entitlements
        ENABLE_PREVIEWS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        LD_RUNPATH_SEARCH_PATHS: $(inherited) @executable_path/../Frameworks
    dependencies:
      - package: MacNetCore
        product: MacNetModels
      - package: MacNetCore
        product: MacNetValidation
      - package: MacNetCore
        product: MacNetDnsmasq
      - package: MacNetCore
        product: MacNetLeases
      - package: MacNetCore
        product: MacNetLogging
      - package: MacNetCore
        product: MacNetXPC
      - package: MacNetCore
        product: MacNetInterfaces
      # The helper ships inside the app bundle. SMAppService resolves it relative to the
      # bundle, so it must be copied — never embedded as a framework — and re-signed.
      # `embed` must stay true: XcodeGen only emits a Copy Files phase for an embedded
      # dependency, and `copy` merely redirects where that phase puts it.
      - target: MacNetLabHelper
        embed: true
        codeSign: true
        copy:
          destination: wrapper
          subpath: Contents/Library/HelperTools
    postBuildScripts:
      - name: Embed LaunchDaemon plist
        script: |
          "${SRCROOT}/Scripts/embed-helper.sh"
        basedOnDependencyAnalysis: false
        outputFiles:
          - $(BUILT_PRODUCTS_DIR)/$(WRAPPER_NAME)/Contents/Library/LaunchDaemons/$(HELPER_LABEL).plist

  # ---------------------------------------------------------------------------------------
  # Privileged helper. Runs as root under launchd; started on demand via its Mach service.
  # Product name must equal the LaunchDaemon label so BundleProgram resolves.
  # ---------------------------------------------------------------------------------------
  MacNetLabHelper:
    type: tool
    platform: macOS
    sources:
      - path: Daemons/MacNetLabHelper
        excludes:
          - "Info.plist"
    settings:
      base:
        PRODUCT_NAME: $(HELPER_LABEL)
        PRODUCT_BUNDLE_IDENTIFIER: $(HELPER_BUNDLE_ID)
        # A tool has no bundle, so its Info.plist is linked into the binary as a __TEXT
        # section. Bundle.main.infoDictionary reads it back at runtime.
        INFOPLIST_FILE: Daemons/MacNetLabHelper/Info.plist
        CREATE_INFOPLIST_SECTION_IN_BINARY: YES
        SKIP_INSTALL: YES
        # Ticket §10: the helper links only the shared core. No AppKit, no SwiftUI.
        LD_RUNPATH_SEARCH_PATHS: $(inherited) @executable_path/../../../Frameworks
    dependencies:
      - package: MacNetCore
        product: MacNetModels
      - package: MacNetCore
        product: MacNetValidation
      - package: MacNetCore
        product: MacNetDnsmasq
      - package: MacNetCore
        product: MacNetLeases
      - package: MacNetCore
        product: MacNetLogging
      - package: MacNetCore
        product: MacNetXPC
      - package: MacNetCore
        product: MacNetInterfaces

  # ---------------------------------------------------------------------------------------
  # Integration tests for helper runtime logic, driven entirely through injected fakes so
  # that no test requires root (ticket §24.2).
  # ---------------------------------------------------------------------------------------
  HelperIntegrationTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/HelperIntegrationTests
      # The helper's own sources are compiled into the test bundle so its runtime logic can be
      # driven against fakes. main.swift is excluded because top-level executable code cannot
      # live in a bundle, and Info.plist is not source.
      - path: Daemons/MacNetLabHelper
        excludes:
          - "main.swift"
          - "Info.plist"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).helper-integration-tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - package: MacNetCore
        product: MacNetModels
      - package: MacNetCore
        product: MacNetValidation
      - package: MacNetCore
        product: MacNetDnsmasq
      - package: MacNetCore
        product: MacNetXPC
      - package: MacNetCore
        product: MacNetInterfaces
      - package: MacNetCore
        product: MacNetLeases
      - package: MacNetCore
        product: MacNetLogging

  # ---------------------------------------------------------------------------------------
  # Unit tests for app-process logic that cannot live in the shared package.
  #
  # ProfileStore belongs to the app by design — ticket §20.1 forbids the root helper from
  # writing user profiles — so its tests need the app's sources. The target compiles the
  # specific files it exercises rather than taking the app as a test host: a hosted test
  # bundle launches the app, and these tests should not need a window on screen.
  # ---------------------------------------------------------------------------------------
  MacNetLabTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/MacNetLabTests
      - path: Apps/MacNetLab/Infrastructure/Profiles
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).unit-tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - package: MacNetCore
        product: MacNetModels
      - package: MacNetCore
        product: MacNetValidation

  # ---------------------------------------------------------------------------------------
  # Renders the SwiftUI pages to PNG files, off-screen.
  #
  # `ImageRenderer` draws a view hierarchy without a window, so this needs neither Screen
  # Recording permission nor a visible display — which is what makes it usable for
  # documentation and for reviewing a layout change without running the app.
  #
  # It compiles the app's own sources rather than duplicating any view. `MacNetLabApp.swift`
  # is excluded because a bundle cannot contain a second `@main`.
  # ---------------------------------------------------------------------------------------
  MacNetLabScreenshots:
    type: application
    platform: macOS
    sources:
      - path: Tools/ScreenshotTool
        excludes:
          - "Info.plist"
      - path: Apps/MacNetLab
        excludes:
          - "App/MacNetLabApp.swift"
          - "Info.plist"
          - "MacNetLab.entitlements"
    settings:
      base:
        PRODUCT_NAME: MacNetLabScreenshots
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).screenshots
        INFOPLIST_FILE: Tools/ScreenshotTool/Info.plist
        SWIFT_EMIT_LOC_STRINGS: YES
        SKIP_INSTALL: YES
    dependencies:
      - package: MacNetCore
        product: MacNetModels
      - package: MacNetCore
        product: MacNetValidation
      - package: MacNetCore
        product: MacNetDnsmasq
      - package: MacNetCore
        product: MacNetLeases
      - package: MacNetCore
        product: MacNetLogging
      - package: MacNetCore
        product: MacNetXPC
      - package: MacNetCore
        product: MacNetInterfaces

  # ---------------------------------------------------------------------------------------
  # UI tests (ticket §24.3).
  # ---------------------------------------------------------------------------------------
  MacNetLabUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: Tests/MacNetLabUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).ui-tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: MacNetLab
    dependencies:
      - target: MacNetLab

schemes:
  # Its own scheme so `make screenshots` can build just the tool. xcodebuild refuses -target
  # together with -scheme, and requires a scheme whenever -derivedDataPath is given.
  MacNetLabScreenshots:
    build:
      targets:
        MacNetLabScreenshots: [run]
    run:
      config: Debug

  MacNetLab:
    build:
      targets:
        MacNetLab: all
        MacNetLabHelper: all
        MacNetLabScreenshots: [run]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - HelperIntegrationTests
        - MacNetLabTests
        - MacNetLabUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
